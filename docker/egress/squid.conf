http_port 3128
visible_hostname rastro-egress
pid_filename /run/squid/squid.pid
coredump_dir /tmp
cache_log stdio:/dev/stderr
access_log none
cache_store_log none
forwarded_for delete

acl rastro_api src 172.29.254.2/32
acl CONNECT method CONNECT
acl scan_methods method GET HEAD OPTIONS CONNECT
acl safe_ports port 80 443
acl ssl_ports port 443

# Deny special, reserved, private, loopback, link-local and metadata ranges.
# The egress container's OUTPUT firewall independently blocks 0.0.0.0/8 and
# all IPv6 connections after DNS resolution.
acl blocked_destination dst \
  10.0.0.0/8 \
  100.64.0.0/10 \
  127.0.0.0/8 \
  169.254.0.0/16 \
  172.16.0.0/12 \
  192.0.0.0/24 \
  192.0.2.0/24 \
  192.88.99.0/24 \
  192.168.0.0/16 \
  198.18.0.0/15 \
  198.51.100.0/24 \
  203.0.113.0/24 \
  224.0.0.0/4 \
  240.0.0.0/4 \
  ::/128 \
  ::1/128 \
  ::ffff:0:0/96 \
  64:ff9b::/96 \
  64:ff9b:1::/48 \
  100::/64 \
  2001::/23 \
  2001:db8::/32 \
  fc00::/7 \
  fe80::/10 \
  ff00::/8

acl blocked_names dstdomain .localhost .local .internal .home .lan .intranet .corp metadata metadata.google.internal
acl to_localhost dst 127.0.0.0/8 ::1/128
acl to_linklocal dst 169.254.0.0/16 fe80::/10

http_access deny !scan_methods
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access deny blocked_names
http_access deny to_localhost
http_access deny to_linklocal
http_access deny blocked_destination
http_access allow rastro_api
http_access deny all
